name: Core A8 Structural Proof Rules

on:
  push:
    paths:
      - "CORE_0.1_COMPLETENESS_CHECKLIST.md"
      - "CORE_0.1_COMPLETENESS_CHECKLIST.yaml"
      - "docs/set-calculus-core/STRUCTURAL_PROOF_RULES.md"
      - "docs/set-calculus-core/README.md"
      - "docs/set-calculus-core/TRAJECTORY_ADMISSIBILITY_AND_RESOLUTION_DEPTH.md"
      - "docs/set-calculus-core/TRANSFORM_SEMANTICS.md"
      - "docs/set-calculus-core/RESOLUTION_CLOSURE_AND_REOPENING.md"
      - "docs/set-calculus-core/CORE_0.1_PATH_INDEX.md"
      - "docs/philosophy-of-set-calculus/CANONICAL_TERMINOLOGY_LEDGER.md"
      - "scripts/audit_core_a8_structural_proof_rules.py"
      - "scripts/audit_core_g2_path_index.py"
      - ".github/workflows/core-a8-structural-proof-rules.yml"
  pull_request:
    paths:
      - "CORE_0.1_COMPLETENESS_CHECKLIST.md"
      - "CORE_0.1_COMPLETENESS_CHECKLIST.yaml"
      - "docs/set-calculus-core/STRUCTURAL_PROOF_RULES.md"
      - "docs/set-calculus-core/README.md"
      - "docs/set-calculus-core/TRAJECTORY_ADMISSIBILITY_AND_RESOLUTION_DEPTH.md"
      - "docs/set-calculus-core/TRANSFORM_SEMANTICS.md"
      - "docs/set-calculus-core/RESOLUTION_CLOSURE_AND_REOPENING.md"
      - "docs/set-calculus-core/CORE_0.1_PATH_INDEX.md"
      - "docs/philosophy-of-set-calculus/CANONICAL_TERMINOLOGY_LEDGER.md"
      - "scripts/audit_core_a8_structural_proof_rules.py"
      - "scripts/audit_core_g2_path_index.py"
      - ".github/workflows/core-a8-structural-proof-rules.yml"

permissions:
  contents: read

jobs:
  audit:
    name: Validate A8 structural proof rules
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile A8 audit
        run: python -m py_compile scripts/audit_core_a8_structural_proof_rules.py

      - name: Validate A8 structural proof rules
        run: python scripts/audit_core_a8_structural_proof_rules.py

      - name: Capture structured A8 evidence
        if: always()
        run: python scripts/audit_core_a8_structural_proof_rules.py --json
